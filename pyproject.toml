[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welcomescreen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ocr = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]
mineru = [
    "mineru>=2.0.0",
]
vector = [
    "chromadb>=0.5.0",
]

[project.scripts]
noteflow = "backend.main:run"

[tool.setuptools.packages.find]
include = ["backend*"]
